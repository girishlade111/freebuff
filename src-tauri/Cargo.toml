[package]
name = "freebuff"
version = "0.1.0"
description = "A local-first Markdown knowledge management app"
authors = ["FreeBuff"]
edition = "2021"

[lib]
name = "freebuff_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
regex = "1"
